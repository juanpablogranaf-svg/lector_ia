name: 🚀 Build Android APK

on:
  # Ejecutar en cada push a main o develop
  push:
    branches:
      - main
      - develop
  # Ejecutar en Pull Requests
  pull_request:
    branches:
      - main
  # Permitir ejecución manual desde la pestaña Actions de GitHub
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      upload_artifact:
        description: 'Subir APK como artefacto descargable'
        required: true
        default: true
        type: boolean

# Permisos mínimos necesarios
permissions:
  contents: read
  actions: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Análisis y validación del código
  # ─────────────────────────────────────────────────────────────────────────────
  analyze:
    name: 🔍 Análisis de Código
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🐦 Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-${{ runner.os }}-3.24.0'

      - name: 📦 Instalar dependencias
        run: flutter pub get

      - name: 🔬 Ejecutar flutter analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true   # No falla el workflow si hay warnings

      - name: ✅ Verificar formato del código
        run: dart format --set-exit-if-changed lib/
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Build del APK
  # ─────────────────────────────────────────────────────────────────────────────
  build_apk:
    name: 🏗️ Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: analyze    # Espera a que el análisis termine (aunque falle con warnings)

    steps:
      # ── 1. Código fuente ────────────────────────────────────────────────────
      - name: 📥 Checkout del código
        uses: actions/checkout@v4
      - name: 🧹 Clean Gradle caches
        run: |
          rm -rf ~/.gradle/caches ~/.gradle/wrapper android/.gradle
      - name: 🐦 Configurar Flutter 3.24
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-${{ runner.os }}-3.24.0'

      - name: 🧹 Clean project before build
        run: flutter clean

      # ── 2. Java 17 (requerido por AGP 8.x) ─────────────────────────────────
      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'



      # ── 4. Verificar entorno ────────────────────────────────────────────────
      - name: 🩺 Flutter Doctor
        run: flutter doctor -v

      # ── 4.1. Generar archivos Android nativos base
      - name: 🛠️ Asegurar estructura de Android base
        run: |
          echo "Regenerando recursos base con flutter create..."
          mkdir -p /tmp/android_custom
          [ -f android/build.gradle ] && cp android/build.gradle /tmp/android_custom/root_build.gradle || true
          [ -f android/app/build.gradle ] && cp android/app/build.gradle /tmp/android_custom/app_build.gradle || true
          [ -f android/app/src/main/AndroidManifest.xml ] && cp android/app/src/main/AndroidManifest.xml /tmp/android_custom/AndroidManifest.xml || true
          [ -f android/app/src/main/res/xml/file_provider_paths.xml ] && cp android/app/src/main/res/xml/file_provider_paths.xml /tmp/android_custom/file_provider_paths.xml || true
          [ -f pubspec.yaml ] && cp pubspec.yaml /tmp/android_custom/pubspec.yaml || true
          cp -r lib /tmp/android_custom/lib
          
          # Borrar carpeta android para forzar regeneración limpia de todos los recursos (values, mipmaps, etc.)
          rm -rf android
          
          flutter create --org com.lector.ia --project-name lector_ia --platforms android .
          
          # Restaurar los archivos modificados
          [ -f /tmp/android_custom/root_build.gradle ] && cp /tmp/android_custom/root_build.gradle android/build.gradle || true
          [ -f /tmp/android_custom/app_build.gradle ] && cp /tmp/android_custom/app_build.gradle android/app/build.gradle || true
          [ -f /tmp/android_custom/AndroidManifest.xml ] && cp /tmp/android_custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true
          mkdir -p android/app/src/main/res/xml
          [ -f /tmp/android_custom/file_provider_paths.xml ] && cp /tmp/android_custom/file_provider_paths.xml android/app/src/main/res/xml/file_provider_paths.xml || true
          [ -f /tmp/android_custom/pubspec.yaml ] && cp /tmp/android_custom/pubspec.yaml pubspec.yaml || true
          rm -rf lib
          cp -r /tmp/android_custom/lib lib
          rm -rf /tmp/android_custom

      # ── 5. Dependencias con caché ───────────────────────────────────────────
      - name: 🧹 Uninstall Android SDK 35 platform
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --uninstall "platforms;android-35" || true

      - name: 🧹 Remove old Android SDK 35 platform (if present)
        run: |
          if [ -d "$ANDROID_SDK_ROOT/platforms/android-35" ]; then rm -rf "$ANDROID_SDK_ROOT/platforms/android-35"; fi
          if [ -d "$ANDROID_SDK_ROOT/platforms/android-35" ]; then rm -rf "$ANDROID_SDK_ROOT/platforms/android-35"; fi

      - name: 📥 Install Android SDK 34
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 📦 Instalar dependencias de Flutter
        run: |
          flutter pub upgrade
          flutter pub get



      # ── 6. Assets (carpetas vacías) ─────────────────────────────────────────
      - name: 📁 Crear directorios de assets
        run: |
          mkdir -p assets/icons
          mkdir -p assets/animations
          # Crear un archivo placeholder para que Flutter no falle
          touch assets/icons/.gitkeep
          touch assets/animations/.gitkeep

      # ── 7. Signing keystore (DEBUG — sin secretos necesarios) ───────────────
      # Para debug APK usamos el keystore de debug de Android.
      # Para release, descomenta la sección de keystore más abajo.
      - name: 🔑 Preparar keystore de debug
        run: |
          mkdir -p android/app/keystore
          # Generar un keystore de debug para firma
          keytool -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore android/app/keystore/debug.jks \
            -storepass android \
            -dname "CN=Android Debug, O=Android, C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -noprompt 2>/dev/null || true

      # ── 8. Build del APK ────────────────────────────────────────────────────
      - name: 🔨 Compilar APK Debug
        run: |
          flutter build apk \
            --debug \
            --no-shrink \
            --build-name="1.0.0" \
            --build-number="${{ github.run_number }}"

      # ── 8b. (Opcional) Build APK Release con firma ──────────────────────────
      # Descomenta esto y configura los secrets si quieres APK firmado para
      # distribución. Requiere secrets: KEYSTORE_BASE64, KEY_ALIAS,
      # KEY_PASSWORD, STORE_PASSWORD configurados en GitHub → Settings → Secrets
      # - name: 🔐 Preparar Keystore de Release
      #   if: github.event.inputs.build_type == 'release'
      #   run: |
      #     echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore/release.jks
      #
      # - name: 🔨 Compilar APK Release
      #   if: github.event.inputs.build_type == 'release'
      #   env:
      #     KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      #     KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      #     STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      #   run: |
      #     flutter build apk \
      #       --release \
      #       --obfuscate \
      #       --split-debug-info=build/debug-info \
      #       --build-name="1.0.0" \
      #       --build-number="${{ github.run_number }}"

      # ── 9. Renombrar APK con versión y fecha ────────────────────────────────
      - name: 📝 Renombrar APK
        run: |
          DATE=$(date +'%Y%m%d_%H%M')
          BUILD_NUM="${{ github.run_number }}"
          BRANCH="${{ github.ref_name }}"
          # Limpiar nombre de rama para usarlo en el nombre del archivo
          BRANCH_CLEAN=$(echo "$BRANCH" | tr '/' '-')
          
          APK_NAME="LectorIA_v1.0.0_build${BUILD_NUM}_${BRANCH_CLEAN}_${DATE}.apk"
          
          cp build/app/outputs/flutter-apk/app-debug.apk \
             "build/app/outputs/flutter-apk/${APK_NAME}"
          
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV
          echo "APK_PATH=build/app/outputs/flutter-apk/${APK_NAME}" >> $GITHUB_ENV
          
          # Mostrar tamaño del APK
          echo "📦 Tamaño del APK:"
          ls -lh "build/app/outputs/flutter-apk/${APK_NAME}"

      # ── 10. Subir APK como artefacto descargable ─────────────────────────────
      - name: 📤 Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: LectorIA-APK-build${{ github.run_number }}
          path: ${{ env.APK_PATH }}
          retention-days: 30       # Disponible para descarga 30 días
          if-no-files-found: error  # Falla si no encuentra el APK

      # ── 11. Resumen del build en GitHub UI ───────────────────────────────────
      - name: 📊 Resumen del Build
        run: |
          echo "## ✅ Build Completado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 App | LectorIA |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔢 Build | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌿 Rama | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📅 Fecha | $(date +'%d/%m/%Y %H:%M') UTC |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 APK | ${{ env.APK_NAME }} |" >> $GITHUB_STEP_SUMMARY
          APK_SIZE=$(du -sh "${{ env.APK_PATH }}" | cut -f1)
          echo "| 💾 Tamaño | ${APK_SIZE} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Descargar APK" >> $GITHUB_STEP_SUMMARY
          echo "Ve a la pestaña **Actions → Este workflow → Artifacts** para descargar el APK." >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Notificación de resultado
  # ─────────────────────────────────────────────────────────────────────────────
  notify:
    name: 📣 Resultado Final
    runs-on: ubuntu-latest
    needs: build_apk
    if: always()   # Ejecutar siempre, incluso si el build falló

    steps:
      - name: ✅ Build Exitoso
        if: needs.build_apk.result == 'success'
        run: |
          echo "🎉 ¡APK generado correctamente!"
          echo "📥 Descárgalo desde: Actions → LectorIA-APK-build${{ github.run_number }}"

      - name: ❌ Build Fallido
        if: needs.build_apk.result == 'failure'
        run: |
          echo "💥 El build falló. Revisa los logs del job 'Compilar APK Android'."
          exit 1
